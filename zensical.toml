# 09-NOV-2026
# Zensical >= 0.1.0
[project]
dev_addr = "localhost:8000"

site_name = "My vi Site"
site_author = "Manfred Rosenboom"
site_url = "https://maroph.github.io/ex-vi/"
site_description = """
Dedicated to Bill Joy's vi Implementation.
"""

repo_url = "https://github.com/maroph/ex-vi"
repo_name = "maroph/ex-vi"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site"
use_directory_urls = false

not_in_nav = """
/software/*.1.md
/software/*.1.md
"""

copyright = """
Copyright (c) 2023 <a href="https://github.com/maroph">Manfred Rosenboom</a><br/>
<a href="#__consent">Change cookie settings</a>
"""


nav = [
  { "Home" = "index.md" },
  { "Documentation" = "documentation.md" },
  { "Software" = [
    { "About" = "info/about.md" },
    { "heirloom-ex-vi" = "software/heirloom-ex-vi.md" },
    { "ex-vi" = "software/ex-vi.md" },
    { "Ex 1.1" = "software/ex-1.1.md" },
    { "Termcap" = "software/termcap.md" }
  ]},
  { "Info" = [
    { "About"="info/about.md" },
    { "GDPR/DSGVO"="info/gdpr.md" },
    { "License"="info/license.md" },
    { "Resources"="info/resources.md" }
  ]}
]


[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = false
unresolved_footnotes = false
unused_definitions = false
unused_footnotes = false
shadowed_definitions = false
shadowed_footnotes = false


[project.theme]
font = false

favicon = "assets/Vi_logo.ico"
#logo = "assets/vi.png"

language = "en"
direction = "ltr"

features = [
    "announce.dismiss",
    # "content.action.edit",
    # "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow"
]


palette = [
    {
        scheme = "default",
        media = "(prefers-color-scheme: light)",
        toggle = {
            icon = "lucide/sun",
            name = "Switch to dark mode"
          }
    },
    {
        scheme = "slate",
        media = "(prefers-color-scheme: dark)",
        toggle = {
            icon = "lucide/moon",
            name = "Switch to light mode"
          }
    }
]


[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"


[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji" 
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = "true"
line_spans = "__span"
pygments_lang_class = "true"

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.tables]


[project.plugins.minify]
enabled = true
minify_html = true
minify_js = false
minify_css = false
htmlmin_opts = {
    remove_comments = true
}

[project.plugins.privacy]
enabled = true

[project.plugins.search]
enabled = true


[project.extra]
generator = true

social = [
    {
        icon = "fontawesome/brands/github",
        link = "https://github.com/maroph",
        name = "github.com/maroph"
    },
    {
        icon = "fontawesome/brands/mastodon",
        link = "https://mastodon.social/@maroph",
        name = "mastodon.social/@maroph"
    }
]


[project.extra.consent]
title = "Cookie consent"
description = """
    We use cookies to recognize your repeated visits and preferences, as well
    as to measure the effectiveness of our documentation and whether users
    find what they're searching for. With your consent, you're helping us to
    make our documentation better.
"""
actions = [
    "accept",
    "reject",
    "manage" 
]

